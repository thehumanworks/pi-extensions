id: bot-no-required-format-check
valid:
  - |
    function parseDefinition(content: string) {
      const f = parse(content);
      if (f.format !== undefined && f.format !== 2) throw new Error("unsupported");
      if (!f.name) throw new Error("name required");
      return { format: 2 };
    }
invalid:
  - |
    function parseDefinition(content: string) {
      if (f.format !== 2) throw new Error("expected 2");
    }
  - |
    function parseDefinition(content: string) {
      if (f.format === undefined) throw new Error("format required");
      if (f.format !== undefined && f.format !== 2) throw new Error("unsupported");
    }
  - |
    function parseDefinition(content: string) {
      if (!f["format"]) throw new Error("format required");
    }
  - |
    function parseDefinition(content: string) {
      if (!("format" in f)) throw new Error("format required");
    }
  - |
    function parseDefinition(content: string) {
      if (!Object.hasOwn(f, "format")) throw new Error("format required");
    }
