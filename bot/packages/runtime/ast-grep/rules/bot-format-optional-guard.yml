id: bot-format-optional-guard
language: TypeScript
severity: error
message: BOT.md format is optional. Keep the absence-aware version guard; omitted format uses v2 semantics.
files:
  - src/**/*.ts
rule:
  all:
    - kind: function_declaration
    - has:
        field: name
        regex: ^parseDefinition$
    - not:
        has:
          stopBy: end
          pattern: if ($F.format !== undefined && $F.format !== 2) $BODY
