# Offline validation, live read-only smoke, then independent review.
type: graph
# Only dotenvx may decrypt/load the local credential file; Dagu must not shadow it.
dotenv: []
# Explicit runner env: Dagu does not inherit arbitrary parent variables.
# Create this private directory before launching (see workflows/README.md).
env:
  - TMPDIR: "${params.WORKSPACE}/.atlassian/tmp"
max_active_steps: 2
params:
  - WORKSPACE: "/home/rodat/.config/mise/agents/pi/extensions/atlassian"
harnesses:
  pi-codex:
    binary: pi
    prefix_args: ["--print", "--provider", "openai", "--no-extensions", "--no-mcp", "--no-skills", "--no-prompt-templates", "--no-session", "--no-context-files", "--no-approve", "--tools", "read,bash,edit,write"]
    prompt_mode: arg
    prompt_position: after_flags
steps:
  - id: typecheck
    working_dir: "${params.WORKSPACE}"
    run: npm run check
    stdout: { artifact: checks/typecheck.txt }
    stderr: { artifact: logs/typecheck.log }
  - id: offline_tests
    working_dir: "${params.WORKSPACE}"
    run: npm test
    stdout: { artifact: checks/offline-tests.txt }
    stderr: { artifact: logs/offline-tests.log }
  - id: live_readonly_e2e
    depends: [typecheck, offline_tests]
    working_dir: "${params.WORKSPACE}"
    env:
      - NODE_USE_SYSTEM_CA: "1"
    # Test the specified .env, not an inherited older token. Auth errors must fail.
    run: dotenvx run --strict --overload -f "${params.WORKSPACE}/.env" -- npm run test:e2e
    timeout_sec: 180
    stdout: { artifact: checks/live-readonly-e2e.txt }
    stderr: { artifact: logs/live-readonly-e2e.log }
  - id: independent_review
    depends: [typecheck, offline_tests]
    working_dir: "${params.WORKSPACE}"
    action: harness.run
    with:
      provider: pi-codex
      model: gpt-6-luna
      thinking: high
      prompt: "@workflows/v1/prompts/review.md"
    timeout_sec: 900
    stdout: { artifact: review/independent-review.md }
    stderr: { artifact: logs/independent-review.log }
